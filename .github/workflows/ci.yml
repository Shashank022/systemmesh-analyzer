name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn -B -ntp clean test
      - name: Package
        run: mvn -B -ntp package -DskipTests
      - name: Smoke test CLI
        run: java -jar target/systemmesh-analyzer-0.1.0-SNAPSHOT.jar rules
